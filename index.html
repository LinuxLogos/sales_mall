<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WMS - Warehouse Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
  <style>
    :root { --primary: #1A312C; --accent: #2d4a43; --danger: #8B0000; }
    body { background: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
    .nav-active { background: rgba(255,255,255,0.15); font-weight: 600; }
    .sidebar { width: 260px; background: linear-gradient(180deg, #0f1f1c 0%, #1A312C 100%); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="flex h-screen">

  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-primary p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center text-primary mb-2">WMS</h1>
      <p class="text-gray-500 text-center mb-8 text-sm">Gestion d'Entrepôt Intelligente</p>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <input type="email" id="log-email" placeholder="Email" class="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-primary outline-none transition-all" required>
        <input type="password" id="log-pass" placeholder="Mot de passe" class="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-primary outline-none transition-all" required>
        <button type="submit" id="log-btn" class="w-full bg-primary text-white p-4 rounded-xl font-bold hover:opacity-90 transition-all shadow-lg">SE CONNECTER</button>
      </form>
    </div>
  </div>

  <div id="app-shell" class="hidden flex h-full w-full">
    <aside class="sidebar text-white flex flex-col p-6">
      <div class="text-2xl font-black mb-10 flex items-center gap-3">📦 <span id="app-title">WMS</span></div>
      <nav class="flex-grow space-y-2">
        <button onclick="nav('dashboard')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition-all"><i data-lucide="layout-dashboard"></i> Dashboard</button>
        <button onclick="nav('pos')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition-all"><i data-lucide="shopping-cart"></i> POS (Vente)</button>
        <button onclick="nav('stock')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition-all"><i data-lucide="package"></i> Stock</button>
        <button onclick="nav('products')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition-all"><i data-lucide="tags"></i> Produits</button>
        <button onclick="nav('clients')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition-all"><i data-lucide="users"></i> Clients</button>
        <button onclick="nav('reports')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition-all"><i data-lucide="pie-chart"></i> Rapports</button>
      </nav>
      <button onclick="logout()" class="flex items-center gap-3 p-3 text-red-300 hover:text-red-100 transition-all mt-auto"><i data-lucide="log-out"></i> Déconnexion</button>
    </aside>

    <main class="flex-grow flex flex-col">
      <header class="bg-white p-6 flex justify-between items-center shadow-sm">
        <h2 id="page-name" class="text-2xl font-bold text-gray-800">Tableau de Bord</h2>
        <div class="flex items-center gap-4">
          <div class="text-right">
            <div id="u-name" class="font-bold text-sm">Chargement...</div>
            <div id="u-role" class="text-xs text-gray-500">Rôle</div>
          </div>
          <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold text-primary border-2 border-primary/10">A</div>
        </div>
      </header>

      <div id="view-port" class="p-8 flex-grow overflow-y-auto custom-scroll"></div>
    </main>
  </div>

  <div id="modal-base" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-8 custom-scroll relative">
      <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-800"><i data-lucide="x"></i></button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const INIT = JSON.parse('<?!= init ?>');
    let STATE = { token: null, user: null, view: 'dashboard', cart: [] };

    window.onload = () => {
      document.getElementById('app-title').innerText = INIT.app;
      lucide.createIcons();
      const saved = sessionStorage.getItem('token');
      if (saved) { STATE.token = saved; STATE.user = JSON.parse(sessionStorage.getItem('user')); showApp(); }
    };

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      document.getElementById('u-name').innerText = STATE.user.name;
      document.getElementById('u-role').innerText = STATE.user.role;
      nav('dashboard');
    }

    async function nav(v) {
      STATE.view = v;
      document.getElementById('page-name').innerText = v.toUpperCase();
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
      const port = document.getElementById('view-port');
      port.innerHTML = '<div class="flex items-center justify-center h-full"><div class="animate-spin text-primary">⌛</div></div>';

      try {
        if (v === 'dashboard') renderDashboard();
        if (v === 'pos') renderPOS();
        if (v === 'stock') renderStock();
        if (v === 'products') renderProducts();
        if (v === 'clients') renderClients();
        if (v === 'reports') renderReports();
      } catch(e) { showToast(e.message, 'danger'); }
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('log-btn');
      btn.disabled = true; btn.innerText = 'Patientez...';
      const res = await call('login', document.getElementById('log-email').value, document.getElementById('log-pass').value);
      if (res.success) {
        STATE.token = res.token; STATE.user = res.user;
        sessionStorage.setItem('token', res.token); sessionStorage.setItem('user', JSON.stringify(res.user));
        showApp();
      } else { alert(res.error); btn.disabled = false; btn.innerText = 'SE CONNECTER'; }
    }

    async function renderDashboard() {
      const data = await call('getDashboardData', STATE.token);
      document.getElementById('view-port').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
          ${statCard('Ventes/Jour', data.dailySales, '💰', 'green')}
          ${statCard('Transactions', data.dailyTransactions, '🧾', 'blue')}
          ${statCard('Types Produits', data.totalStockTypes, '📦', 'indigo')}
          ${statCard('Alertes Stock', data.stockAlerts, '⚠️', 'red')}
        </div>
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <h3 class="font-bold mb-4">Activité Récente</h3>
          <table class="w-full text-left text-sm">
            <tr class="text-gray-400 border-b">
              <th class="py-3">Heure</th><th class="py-3">Action</th><th class="py-3">Détails</th>
            </tr>
            ${data.recentActivity.map(a => `
              <tr class="border-b last:border-0">
                <td class="py-4 text-gray-500">${new Date(a.time).toLocaleTimeString('fr-FR')}</td>
                <td class="py-4 font-bold">${a.action}</td>
                <td class="py-4 text-gray-600">${a.desc}</td>
              </tr>
            `).join('')}
          </table>
        </div>
      `;
    }

    async function renderPOS() {
      const prods = await call('getProductCatalog', STATE.token);
      document.getElementById('view-port').innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 h-full overflow-hidden">
          <div class="lg:col-span-2 flex flex-col gap-6 overflow-hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm border flex gap-4">
              <input type="text" id="pos-search" placeholder="Scanner ou rechercher..." class="flex-grow outline-none text-lg">
              <div class="p-2 bg-slate-100 rounded-lg text-slate-400"><i data-lucide="search"></i></div>
            </div>
            <div id="pos-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto custom-scroll pr-2">
              ${prods.map(p => `
                <div onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-primary cursor-pointer transition-all shadow-sm">
                  <div class="text-[10px] text-gray-400 mb-1">${p.SKU}</div>
                  <div class="font-bold text-sm truncate mb-2">${p.Designation}</div>
                  <div class="flex justify-between items-center">
                    <span class="text-primary font-bold">${p.PrixVente}</span>
                    <span class="text-[10px] bg-slate-100 px-2 py-1 rounded">${p.StockDisponible} in</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="bg-white rounded-2xl shadow-md border border-slate-100 flex flex-col overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
              <span class="font-bold text-lg">Panier</span>
              <button onclick="STATE.cart=[];updateCartUI()" class="text-xs text-red-500 hover:underline">Vider</button>
            </div>
            <div id="cart-list" class="flex-grow p-4 space-y-3 overflow-y-auto custom-scroll"></div>
            <div class="p-6 bg-slate-50 border-t space-y-4">
               <div class="flex justify-between font-bold text-xl text-primary"><span>Total</span><span id="cart-total">0</span></div>
               <button onclick="openCheckout()" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-green-700 transition-all">ENCAISSER</button>
            </div>
          </div>
        </div>
      `;
    }

    function addToCart(p) {
      if (p.StockDisponible <= 0) return alert('Rupture de stock');
      const ex = STATE.cart.find(it => it.SKU === p.SKU);
      if (ex) ex.Quantity++; else STATE.cart.push({ ...p, Quantity: 1, UnitPrice: p.PrixVente });
      updateCartUI();
    }

    function updateCartUI() {
      const list = document.getElementById('cart-list');
      list.innerHTML = STATE.cart.map((it, idx) => `
        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100">
          <div class="flex-grow">
            <div class="text-xs font-bold truncate max-w-[150px]">${it.Designation}</div>
            <div class="text-[10px] text-gray-400">${it.Quantity} x ${it.UnitPrice}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${idx},-1)" class="w-6 h-6 bg-white border rounded shadow-sm hover:bg-gray-100">-</button>
            <span class="text-xs font-bold w-4 text-center">${it.Quantity}</span>
            <button onclick="changeQty(${idx},1)" class="w-6 h-6 bg-white border rounded shadow-sm hover:bg-gray-100">+</button>
          </div>
        </div>
      `).join('');
      document.getElementById('cart-total').innerText = STATE.cart.reduce((s, i) => s + (i.Quantity * i.UnitPrice), 0).toLocaleString();
    }

    function changeQty(i, d) {
      STATE.cart[i].Quantity += d;
      if (STATE.cart[i].Quantity <= 0) STATE.cart.splice(i, 1);
      updateCartUI();
    }

    function openCheckout() {
      if (STATE.cart.length === 0) return alert('Panier vide');
      openModal(`
        <h3 class="text-xl font-bold mb-6">Finaliser la Vente</h3>
        <form onsubmit="handleCheckout(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2"><label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Client (Sélection)</label><select id="chk-client-id" class="w-full p-3 border rounded-xl bg-slate-50 outline-none"><option value="MANUAL">Client Comptoir (Saisie Manuelle)</option></select></div>
            <div class="col-span-2 bg-slate-50 p-4 rounded-xl space-y-3">
              <input type="text" id="chk-cli-name" placeholder="Nom Client" class="w-full p-2 bg-white border rounded-lg">
              <input type="text" id="chk-cli-phone" placeholder="Téléphone" class="w-full p-2 bg-white border rounded-lg">
            </div>
            <div><label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Paiement</label><select id="chk-pay" class="w-full p-3 border rounded-xl outline-none"><option>ESPECE</option><option>CARTE</option><option>MOBILE</option></select></div>
            <div><label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Site</label><input id="chk-site" value="MAIN" class="w-full p-3 border rounded-xl outline-none"></div>
          </div>
          <button type="submit" class="w-full bg-primary text-white p-4 rounded-xl font-bold mt-6">VALIDER & IMPRIMER</button>
        </form>
      `);
    }

    async function handleCheckout(e) {
      e.preventDefault();
      const res = await call('createSale', STATE.token, {
        Site_ID: document.getElementById('chk-site').value,
        Caisse_ID: 'C01',
        Items: STATE.cart,
        PaymentMethod: document.getElementById('chk-pay').value,
        Client_Details: { Nom: document.getElementById('chk-cli-name').value, Phone: document.getElementById('chk-cli-phone').value }
      });
      if (res.success) {
        closeModal(); STATE.cart = []; nav('pos');
        const win = window.open('', '_blank');
        win.document.write(res.pdf);
        win.document.close(); win.print();
        showToast('Vente réussie !');
      }
    }

    async function renderStock() {
      const data = await call('getStockOverview', STATE.token);
      document.getElementById('view-port').innerHTML = `
        <div class="flex justify-between items-center mb-8">
          <div class="flex gap-4"><input type="text" id="s-filter" oninput="filterStock(this.value)" placeholder="Filtrer SKU..." class="p-3 border rounded-xl outline-none w-64"></div>
          <div class="flex gap-2">
            <button onclick="window.print()" class="bg-white border p-3 rounded-xl hover:bg-slate-50 shadow-sm"><i data-lucide="printer" class="w-5 h-5"></i></button>
            <button onclick="openAddProd()" class="bg-primary text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-primary/20">+ Ajouter</button>
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-slate-50 text-xs font-bold text-gray-400 uppercase">
              <tr><th class="p-6">SKU/Designation</th><th class="p-6">Position</th><th class="p-6">Physique</th><th class="p-6">Dispo</th><th class="p-6">Statut</th></tr>
            </thead>
            <tbody id="stock-tbody" class="divide-y divide-slate-100">
              ${data.stock.map(s => `
                <tr class="hover:bg-slate-50/50">
                  <td class="p-6"><div class="font-bold">${s.SKU}</div><div class="text-xs text-gray-400">${s.Designation}</div></td>
                  <td class="p-6"><span class="bg-slate-100 px-3 py-1 rounded-full text-xs font-mono">${s.Location}</span></td>
                  <td class="p-6 font-bold">${s.StockPhysique}</td>
                  <td class="p-6 font-black text-primary">${s.StockDisponible}</td>
                  <td class="p-6"><span class="px-3 py-1 rounded-full text-[10px] font-black ${s.StockDisponible <= 0 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${s.StockDisponible <= 0 ? 'RUPTURE' : 'OK'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      lucide.createIcons();
    }

    // SHARED UI HELPERS
    function statCard(t, v, i, c) {
      return `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
          <div><div class="text-xs font-bold text-gray-400 uppercase mb-1">${t}</div><div class="text-3xl font-black text-primary">${v.toLocaleString()}</div></div>
          <div class="w-14 h-14 bg-${c}-50 text-${c}-600 rounded-2xl flex items-center justify-center text-2xl">${i}</div>
        </div>
      `;
    }

    async function call(f, ...args) {
      return new Promise((resolve) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(e => { alert(e.message); resolve({success:false, error:e.message}); })[f](...args);
      });
    }

    function openModal(html) {
      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal-base').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() { document.getElementById('modal-base').classList.add('hidden'); }

    function showToast(m, t = 'success') {
      alert(m); // Fallback to alert for simplicity in this snippet, can replace with toast element
    }

    function logout() { sessionStorage.clear(); location.reload(); }

    // Additional placeholders for missing functions called in templates
    function renderProducts() { document.getElementById('view-port').innerHTML = '<div class="p-20 text-center text-gray-400">Catalogue Produits - En cours</div>'; }
    function renderClients() { document.getElementById('view-port').innerHTML = '<div class="p-20 text-center text-gray-400">Gestion Clients - En cours</div>'; }
    function renderReports() { document.getElementById('view-port').innerHTML = '<div class="p-20 text-center text-gray-400">Rapports BI - En cours</div>'; }
  </script>
</body>
</html>
